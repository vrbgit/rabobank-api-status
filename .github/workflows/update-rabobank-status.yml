name: Update Rabobank status page

on:
  repository_dispatch:
    types:
      - update-rabobank-status

permissions:
  contents: write
  issues: write

concurrency:
  group: update-rabobank-status
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository ophalen
      - name: Repository ophalen
        uses: actions/checkout@v4

      # 2. Zoek het nieuwste open issue dat Power Automate heeft aangemaakt
      - name: Nieuwste HTML-overdrachtsissue zoeken
        id: transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "POWER-AUTOMATE-HTML in:title" \
              --json number,title,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].number'
          )"

          if [ -z "$issue_number" ] || [ "$issue_number" = "null" ]; then
            echo "Geen open HTML-overdrachtsissue gevonden."
            exit 1
          fi

          echo "Gevonden issue: #$issue_number"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"

      # 3. HTML uit de body van het issue halen
      - name: HTML uit issue ophalen
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.transfer.outputs.issue_number }}
        run: |
          mkdir -p docs

          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body' > docs/index.html

      # 4. Controleren of daadwerkelijk HTML ontvangen is
      - name: HTML controleren
        run: |
          echo "=== HTML controle gestart ==="

          if [ ! -f docs/index.html ]; then
            echo "FOUT: docs/index.html bestaat niet."
            exit 1
          fi

          echo "Bestand bestaat."

          if [ ! -s docs/index.html ]; then
            echo "FOUT: docs/index.html is leeg."
            exit 1
          fi

          echo "Bestandsgrootte:"
          wc -c docs/index.html

          echo "Eerste 20 regels:"
          head -n 20 docs/index.html

          if ! grep -qi "<html" docs/index.html; then
            echo "FOUT: De ontvangen inhoud bevat geen <html>-element."
            echo "Hierboven staat de daadwerkelijk ontvangen inhoud."
            exit 1
          fi

          echo "HTML succesvol gecontroleerd."
      # 5. Jekyll expliciet uitschakelen
      - name: Jekyll uitschakelen
        run: |
          touch docs/.nojekyll
          echo "docs/.nojekyll aangemaakt."

      # 6. HTML en .nojekyll naar repository schrijven
      - name: HTML publiceren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/.nojekyll

          if git diff --cached --quiet; then
            echo "De HTML is niet gewijzigd."
          else
            git commit -m "Update Rabobank API status page"
            git push
          fi

      # 7. Issue pas sluiten als alle voorgaande stappen succesvol zijn
      - name: Overdrachtsissue sluiten
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.transfer.outputs.issue_number }}
        run: |
          gh issue close "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --comment "HTML is verwerkt en gepubliceerd naar docs/index.html."
